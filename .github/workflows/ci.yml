name: CKCchain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Go test
        run: go test ./...
      - name: Genesis hash check
        run: ./scripts/verify-genesis.sh
