[chain]
name = "CKCchain"
chain_id = 8898
network_id = 8898

[node]
data_dir = "/var/lib/ckcchain"
max_peers = 100

[rpc]
http = true
http_addr = "127.0.0.1"
http_port = 8545
ws = true
ws_addr = "127.0.0.1"
ws_port = 8546

[p2p]
listen_addr = "0.0.0.0:30303"

[consensus]
name = "fast-bft-posa"
block_time_seconds = 2
validator_mode = true

[validator]
# Populate only with public validator identities at deployment time.
# private_key_file must point to an OFF-REPO secret.
# private_key_file = "/etc/ckcchain/secrets/validator.key"
